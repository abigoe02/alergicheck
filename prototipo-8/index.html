<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<title>AlergiCheck · Guía de alérgenos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#f7f4ef;--sup:#ffffff;--sutil:#efebe5;--hero:#f1e6df;
  --brand:#7a4a35;--brand-d:#5f3926;--brand-s:#f3e9e2;
  --tx:#1b1916;--tx2:#4f4942;--tx3:#6a6259;--inv:#ffffff;
  --bd:#ddd6cc;--bd-f:#1b1916;
  --red:#b42318;--red-t:#8a1c12;--red-b:#fcebe8;
  --grn:#1c7a47;--grn-t:#135532;--grn-b:#e3f2e8;
  --amb:#a15c00;--amb-t:#6e3f00;--amb-b:#fbefd8;
  --s-2xs:4px;--s-xs:8px;--s-sm:12px;--s-md:16px;--s-lg:20px;--s-xl:24px;--s-2xl:32px;
  --r-sm:8px;--r-md:14px;--r-lg:20px;--r-full:999px;
  --out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b2724;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
::selection{background:var(--brand-s);color:var(--brand-d)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#phone{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:520px){#phone{height:min(852px,calc(100dvh - 32px));margin-top:16px;border-radius:32px;box-shadow:0 24px 64px rgba(0,0,0,.45)}}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);animation:enter .28s var(--out)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--s-sm);padding:calc(var(--s-md) + env(safe-area-inset-top)) var(--s-md) 0}
.brand{display:flex;align-items:center;gap:var(--s-xs);font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.where{font-size:13px;color:var(--tx2);text-align:right;line-height:16px}
.where b{display:block;color:var(--tx);font-weight:700}

/* ---------- reposo ---------- */
#rest{cursor:pointer}
.rest-body{flex:1;display:flex;flex-direction:column;padding:0 var(--s-md);min-height:0}
.rest-h{font-size:36px;line-height:40px;font-weight:800;letter-spacing:-.03em;margin:40px 0 var(--s-sm);text-wrap:balance}
.rest-p{font-size:17px;line-height:24px;color:var(--tx2);margin:0;max-width:30ch}
.icons-row{display:flex;justify-content:space-between;margin:28px 0 0}
.ic-b{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;font-size:13px;font-weight:700;color:var(--tx)}
.ic-b .c{width:56px;height:56px;border-radius:50%;background:var(--sup);border:1.5px solid var(--bd);display:grid;place-items:center;color:var(--brand)}
.webqr{display:flex;align-items:center;gap:var(--s-sm);margin-top:auto;margin-bottom:var(--s-md);padding:var(--s-sm);border-radius:var(--r-md);background:var(--sup);border:1px solid var(--bd);text-align:left;width:100%}
.webqr .q{flex:none;width:76px;height:76px;border-radius:8px;background:#fff;display:grid;place-items:center;border:1px solid var(--bd)}
.webqr .q svg,.webqr .q img{width:68px;height:68px}
.webqr b{display:block;font-size:15px;line-height:20px}
.webqr span{font-size:13px;line-height:18px;color:var(--tx2)}
.rest-foot{padding:var(--s-sm) var(--s-md) calc(var(--s-lg) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--s-sm)}
.start{display:flex;align-items:center;justify-content:center;gap:var(--s-sm);width:100%;min-height:64px;border-radius:var(--r-md);background:var(--brand);color:var(--inv);font-size:19px;font-weight:700;box-shadow:0 6px 16px rgba(27,25,22,.18);animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.015)}}
.verified{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);line-height:18px}

/* ---------- paso: ¿qué evitas? ---------- */
.step{padding:var(--s-sm) var(--s-md) var(--s-md);display:flex;flex-direction:column;gap:var(--s-sm)}
.h1{font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lead{font-size:16px;line-height:22px;color:var(--tx2);margin:6px 0 0}
.appqr{display:flex;align-items:center;gap:var(--s-sm);width:100%;padding:8px var(--s-md);min-height:56px;border-radius:var(--r-md);background:var(--brand-s);color:var(--brand-d);text-align:left;font-size:15px;line-height:20px;font-weight:700}
.appqr small{display:block;font-size:13px;font-weight:500;color:var(--tx2)}
.appqr .ico{flex:none;width:40px;height:40px;border-radius:10px;background:var(--sup);display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-xs)}
.tile{position:relative;display:flex;align-items:center;gap:10px;min-height:62px;padding:8px 10px;border-radius:var(--r-md);border:2px solid var(--bd);background:var(--sup);text-align:left;transition:background .2s var(--out),border-color .2s var(--out),color .2s var(--out),transform .12s}
.tile:active{transform:scale(.97)}
.tile .ti{flex:none;width:38px;height:38px;border-radius:50%;background:var(--sutil);display:grid;place-items:center;color:var(--tx);transition:background .2s}
.tile b{display:block;font-size:16px;line-height:20px;white-space:nowrap}
.tile small{display:block;font-size:13px;line-height:17px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ck{position:absolute;left:34px;top:6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--sup);background:var(--brand);display:grid;place-items:center;transform:scale(0);transition:transform .2s var(--out)}
.tile .ck svg{opacity:0;transition:opacity .15s}
.tile[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-s)}
.tile[aria-pressed="true"] .ti{background:var(--sup);color:var(--brand)}
.tile[aria-pressed="true"] .ck{transform:scale(1)}
.tile[aria-pressed="true"] .ck svg{opacity:1}
.more-al{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:var(--r-md);border:1.5px dashed var(--brand);color:var(--brand);font-size:15px;font-weight:700}

/* ---------- catálogo ---------- */
.cat-head{padding:var(--s-md) var(--s-md) 0}
.cat-h{font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.cat-p{font-size:14px;line-height:20px;color:var(--tx2);margin:4px 0 0;min-height:20px}
.cat-p .lnk{color:var(--brand);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.tools{position:sticky;top:0;z-index:3;background:var(--bg);padding:var(--s-sm) var(--s-md) var(--s-xs);display:flex;flex-direction:column;gap:var(--s-xs)}
.search{display:flex;align-items:center;gap:var(--s-xs);height:50px;padding:0 var(--s-md);background:var(--sup);border:1.5px solid var(--bd);border-radius:var(--r-md);color:var(--tx2)}
.search:focus-within{border-color:var(--brand)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:16px;color:var(--tx)}
.search input::placeholder{color:var(--tx3)}
.search .x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sutil)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--s-md));padding:0 var(--s-md)}
.cats::-webkit-scrollbar{display:none}
.cb{flex:none;min-height:40px;padding:0 14px;border-radius:var(--r-full);border:1.5px solid var(--bd);background:var(--sup);font-size:14px;font-weight:600;white-space:nowrap}
.cb[aria-pressed="true"]{background:var(--tx);border-color:var(--tx);color:var(--inv)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-sm) 10px;padding:0 var(--s-md) var(--s-md)}
.shelf{grid-column:1/-1;display:flex;align-items:center;gap:var(--s-xs);font-size:14px;font-weight:800;color:var(--tx);margin:var(--s-sm) 0 0}
.shelf small{font-weight:600;color:var(--tx3)}
.shelf::after{content:"";flex:1;height:1px;background:var(--bd)}
.card{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;border-radius:var(--r-md);background:var(--sup);border:1.5px solid var(--bd);overflow:hidden;
  transition:opacity .35s var(--out) calc(var(--i)*18ms),border-color .35s var(--out) calc(var(--i)*18ms),box-shadow .35s var(--out) calc(var(--i)*18ms),background .35s var(--out) calc(var(--i)*18ms),transform .15s}
.card:active{transform:scale(.97)}
.ph{position:relative;aspect-ratio:4/3;display:grid;place-items:center;background:var(--sutil);transition:filter .35s var(--out) calc(var(--i)*18ms),opacity .35s var(--out) calc(var(--i)*18ms)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cbody{display:flex;flex-direction:column;gap:2px;padding:10px 10px 10px;flex:1}
.nm{font-size:15px;line-height:19px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-decoration:line-through;text-decoration-color:transparent;text-decoration-thickness:2px;transition:color .35s var(--out) calc(var(--i)*18ms),text-decoration-color .35s var(--out) calc(var(--i)*18ms)}
.br{font-size:12.5px;line-height:16px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{margin-top:auto;padding-top:8px;min-height:34px;display:flex;align-items:flex-end}
.dots{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.dot{width:26px;height:26px;border-radius:50%;background:var(--sutil);display:grid;place-items:center;color:var(--tx)}
.dot.more{font-size:12px;font-weight:700}
.trz{font-size:12.5px;font-weight:700;color:var(--tx2);white-space:nowrap;margin-left:2px}
.none{font-size:13px;font-weight:600;color:var(--grn-t)}
.pill{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:5px 10px;border-radius:var(--r-full);font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pop .3s var(--out) calc(var(--i)*18ms) both}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pill svg{flex:none}
.p-ok{background:var(--grn-b);color:var(--grn-t)}
.p-tr{background:var(--amb-b);color:var(--amb-t)}
.p-no{background:var(--red-b);color:var(--red-t)}
.p-nd{background:var(--sutil);color:var(--tx2)}
/* estados filtrados */
.card.ok{border:2.5px solid var(--grn);box-shadow:0 2px 10px rgba(28,122,71,.16)}
.card.tr{border:2.5px solid var(--amb)}
.card.no,.card.nd{background:#fbfaf8}
.card.no .ph,.card.nd .ph{filter:grayscale(1);opacity:.45}
.card.no .nm{color:var(--tx3);text-decoration-color:var(--red)}
.card.nd .nm{color:var(--tx3)}
.card.lit{animation:lit .7s var(--out) calc(var(--i)*18ms)}
@keyframes lit{0%{box-shadow:0 0 0 0 rgba(28,122,71,.45)}100%{box-shadow:0 0 0 10px rgba(28,122,71,0),0 2px 10px rgba(28,122,71,.16)}}
.empty{grid-column:1/-1;padding:var(--s-xl) var(--s-md);text-align:center;color:var(--tx2);font-size:15px;line-height:21px}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:4px}
.skel{border-radius:var(--r-md);background:linear-gradient(90deg,var(--sutil),#f6f2ec,var(--sutil));background-size:200% 100%;animation:sk 1.2s linear infinite;aspect-ratio:3/4}
@keyframes sk{to{background-position:-200% 0}}

/* barra inferior: resumen de lo que evitas */
.avoid{display:flex;align-items:center;gap:var(--s-sm);background:var(--sup);border-top:1px solid var(--bd);padding:var(--s-sm) var(--s-md) calc(var(--s-sm) + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(27,25,22,.06)}
.avoid .lbl{flex:1;min-width:0;font-size:13px;color:var(--tx2);line-height:18px}
.avoid .lbl b{display:block;font-size:15.5px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avoid .chg{flex:none;min-height:48px;padding:0 18px;border-radius:12px;background:var(--brand);color:var(--inv);font-size:15px;font-weight:700}

/* ---------- ficha ---------- */
.f-top{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--s-md) + env(safe-area-inset-top)) var(--s-md) 0}
.back{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 18px 0 14px;border:1.5px solid var(--tx);border-radius:12px;background:var(--sup);font-size:16px;font-weight:700}
.timer{font-size:13px;color:var(--tx2)}
.timer b{font-weight:700;color:var(--tx)}
.ficha{padding:var(--s-md);display:flex;flex-direction:column;gap:var(--s-md)}
.hero{display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--hero);overflow:hidden}
.hero .ph{aspect-ratio:16/9;background:var(--hero)}
.hero .hi{padding:var(--s-sm) var(--s-md) var(--s-md)}
.hero h2{font-size:22px;line-height:27px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
.hero .meta{font-size:14px;color:var(--tx2)}
.verdict{display:flex;gap:var(--s-sm);align-items:flex-start;padding:var(--s-md);border-radius:var(--r-lg);animation:enter .35s var(--out) .05s both}
.verdict .vi{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.verdict h3{font-size:21px;line-height:26px;font-weight:800;margin:0 0 2px}
.verdict p{margin:0;font-size:15px;line-height:21px}
.v-ok{background:var(--grn-b)}.v-ok .vi{background:var(--grn)}.v-ok h3,.v-ok p{color:var(--grn-t)}
.v-tr{background:var(--amb-b)}.v-tr .vi{background:var(--amb)}.v-tr h3,.v-tr p{color:var(--amb-t)}
.v-no{background:var(--red-b)}.v-no .vi{background:var(--red)}.v-no h3,.v-no p{color:var(--red-t)}
.v-ne{background:var(--sup);border:1px solid var(--bd)}.v-ne .vi{background:var(--brand-s)}.v-ne h3{color:var(--tx)}.v-ne p{color:var(--tx2)}
.sec-h{font-size:17px;font-weight:800;margin:var(--s-xs) 0 calc(-1 * var(--s-xs))}
.table{background:var(--sup);border:1px solid var(--bd);border-radius:var(--r-md);padding:0 var(--s-md)}
.ar{display:flex;align-items:center;gap:var(--s-sm);min-height:62px;padding:8px 0;border-bottom:1px solid var(--bd)}
.ar:last-child{border-bottom:0}
.ar .ai{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sutil);display:grid;place-items:center}
.ar .nmx{flex:1;min-width:0}
.ar .nmx b{display:flex;align-items:center;gap:6px;font-size:16px;line-height:20px;font-weight:600}
.ar.mine .nmx b{font-weight:800}
.ar .nmx small{display:block;font-size:13px;line-height:17px;color:var(--tx2);margin-top:1px}
.evit{font-size:11.5px;font-weight:800;color:var(--brand);background:var(--brand-s);border-radius:var(--r-full);padding:2px 8px}
.res{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;white-space:nowrap;text-align:right}
.r-ok{color:var(--grn-t)}.r-tr{color:var(--amb-t)}.r-no{color:var(--red-t)}.r-nd{color:var(--tx3);font-weight:600}
.rest-note{font-size:14px;color:var(--tx2);padding:12px 0 14px;border-top:1px solid var(--bd);line-height:19px}
.explain{display:flex;gap:var(--s-sm);padding:var(--s-md);border-radius:var(--r-md);background:var(--amb-b);color:var(--amb-t)}
.explain .ei{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sup);display:grid;place-items:center}
.explain b{display:block;font-size:15.5px;line-height:20px;margin-bottom:2px}
.explain p{margin:0;font-size:14.5px;line-height:20px}
.ing h4{font-size:17px;font-weight:800;margin:0 0 4px}
.ing p{font-size:15px;line-height:21px;color:var(--tx2);margin:0}
.src{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:19px;color:var(--tx2);margin-top:var(--s-sm)}
.src b{color:var(--tx)}
.src svg{flex:none;margin-top:2px}
details.nut{background:var(--sup);border:1px solid var(--bd);border-radius:var(--r-md)}
details.nut summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 var(--s-md);font-size:16px;font-weight:800;cursor:pointer}
details.nut summary::-webkit-details-marker{display:none}
details.nut summary small{font-weight:600;color:var(--tx3);font-size:13px}
details.nut summary .chev{transition:transform .2s}
details.nut[open] summary .chev{transform:rotate(90deg)}
.ntab{padding:0 var(--s-md) var(--s-md)}
.nrow{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--bd);font-size:15px}
.nrow b{font-variant-numeric:tabular-nums}
.oct{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.oct span{width:64px;height:64px;display:grid;place-items:center;text-align:center;background:#111;color:#fff;font-size:9.5px;line-height:11px;font-weight:800;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);padding:6px}
.nnote{font-size:12.5px;line-height:17px;color:var(--tx3);margin:8px 0 0}
.f-foot{padding:var(--s-sm) var(--s-md) calc(var(--s-md) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--s-xs);background:var(--bg)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:var(--r-md);font-size:17px;font-weight:700;transition:transform .12s,background .2s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--brand);color:var(--inv)}
.btn-s{background:var(--sup);color:var(--tx);border:1.5px solid var(--tx)}
.btn[disabled]{opacity:.6}

/* ---------- hojas (QR, trazas) ---------- */
.bd{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s var(--out)}
.bd.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--sup);border-radius:24px 24px 0 0;padding:10px var(--s-lg) calc(var(--s-lg) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--s-md);transform:translateY(100%);transition:transform .4s var(--out);max-height:92%;overflow-y:auto}
.sheet.show{transform:none}
.sheet .grab{align-self:center;width:44px;height:5px;border-radius:3px;background:var(--bd)}
.sheet h3{margin:0;font-size:22px;line-height:28px;font-weight:800}
.sheet p{margin:0;font-size:15.5px;line-height:22px;color:var(--tx2)}
.qrbig{align-self:center;width:220px;height:220px;padding:10px;border-radius:16px;border:1.5px solid var(--bd);background:#fff;display:grid;place-items:center;position:relative}
.qrbig svg,.qrbig img{width:198px;height:198px}
.qrbig .scanline{position:absolute;left:12px;right:12px;height:3px;border-radius:2px;background:var(--brand);opacity:.7;animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{top:14px}50%{top:calc(100% - 17px)}}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:10px;font-size:15px;line-height:21px}
.steps li span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand-s);color:var(--brand-d);font-weight:800;font-size:13px;display:grid;place-items:center}
.demo-note{font-size:12.5px;line-height:17px;color:var(--tx3);text-align:center}

/* ---------- enviado ---------- */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--s-md) var(--s-lg)}
.halo{width:112px;height:112px;border-radius:50%;background:var(--grn-b);display:grid;place-items:center;animation:halo .6s var(--out)}
.halo span{width:76px;height:76px;border-radius:50%;background:var(--grn);display:grid;place-items:center}
@keyframes halo{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.done h2{font-size:28px;line-height:32px;font-weight:800;letter-spacing:-.02em;margin:var(--s-xl) 0 var(--s-xs);text-wrap:balance}
.done p{font-size:16px;line-height:22px;color:var(--tx2);margin:0;max-width:30ch}
.tip{display:flex;gap:var(--s-sm);text-align:left;margin-top:var(--s-xl);padding:var(--s-md);border:1px solid var(--bd);border-radius:var(--r-md);background:var(--sup);width:100%}
.tip b{display:block;font-size:15px;margin-bottom:2px}
.tip span{font-size:14px;line-height:19px;color:var(--tx2)}

/* ---------- aviso inactividad / toast ---------- */
.idle{position:absolute;left:var(--s-md);right:var(--s-md);bottom:calc(96px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:var(--s-sm);padding:var(--s-sm) var(--s-md);border-radius:var(--r-md);background:var(--tx);color:var(--inv);box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(20px);opacity:0;visibility:hidden;pointer-events:none;transition:transform .3s var(--out),opacity .3s var(--out),visibility 0s .3s}
.idle.show{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:transform .3s var(--out),opacity .3s var(--out)}
.idle p{flex:1;margin:0;font-size:14px;line-height:19px}
.idle b{font-size:16px}
.idle button{flex:none;min-height:44px;padding:0 14px;border-radius:10px;background:var(--sup);color:var(--tx);font-size:14px;font-weight:700}
.toast{position:absolute;left:var(--s-md);right:var(--s-md);top:calc(14px + env(safe-area-inset-top));z-index:40;display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--grn);color:#fff;font-size:15px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(-130%);transition:transform .35s var(--out)}
.toast.show{transform:none}

/* ---------------- QR ---------------- */
function qrSVG(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return '<span style="font-size:11px;color:#6a6259;text-align:center">QR</span>'}}

/* ---------------- Inactividad (solo en la pantalla, no en la versión web) ---------------- */
function resetIdle(){left=IDLE;paintIdle()}
function startIdle(){if(WEB)return;clearInterval(tick);left=IDLE;tick=setInterval(()=>{left--;paintIdle();if(left<=0){clearInterval(tick);goRest()}},1000);paintIdle()}
function paintIdle(){
  const t=$('#timerN');if(t)t.textContent=left;
  const box=$('.idle');if(!box)return;
  box.classList.toggle('show',!WEB&&S.screen!=='rest'&&left<=10&&left>0);
  const n=box.querySelector('b');if(n)n.textContent=left+' s';
}
['pointerdown','keydown','scroll','input'].forEach(e=>document.addEventListener(e,()=>{if(S.screen!=='rest')resetIdle()},{capture:true,passive:true}));
const idleBox=()=>WEB?'':`<div class="idle" role="status"><p>¿Sigues ahí? Volvemos al inicio en <b class="num">10 s</b></p><button data-stay>Seguir aquí</button></div>`;
const timerTxt=()=>WEB?'':`<span class="timer">Vuelve al inicio en <b class="num" id="timerN">${left}</b> s</span>`;

function toast(t){const el=document.createElement('div');el.className='toast';el.innerHTML=`${I.check('#fff',16,2.6)}<span>${t}</span>`;phone.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),400)},2400)}

/* ---------------- Pantallas ---------------- */
const topBar=()=>`<div class="top"><div class="brand"><span class="logo">${I.shield('#fff',16)}</span>AlergiCheck</div><div class="where"><b>${esc(META.cafeteria||'Cafetería')}</b>${WEB?'Versión web':esc(META.sede||'')}</div></div>`;

function cardHTML(p,i){
  const v=verdict(p);let st='';
  if(v.k==='ne'){
    if(p.pending)st=`<span class="pill p-nd">${I.q('#4f4942',12)}Ficha pendiente</span>`;
    else if(!p.c.length&&!p.m.length)st=`<span class="none">${I.check('#135532',12)} Sin alérgenos</span>`;
    else{
      const lim=p.m.length?3:4,max=p.c.length>lim?lim-1:lim,more=p.c.slice(max);
      st=`<span class="dots">${p.c.slice(0,max).map(a=>`<span class="dot" title="${AN[a]}">${ic(a,15)}</span>`).join('')}${more.length?`<span class="dot more" title="${more.map(a=>AN[a]).join(', ')}">+${more.length}</span>`:''}${p.m.length?`<span class="trz">+ trazas</span>`:''}</span>`;
    }
  }else if(v.k==='ok')st=`<span class="pill p-ok">${I.check('#135532',12)}Apto</span>`;
  else if(v.k==='tr')st=`<span class="pill p-tr">${I.warn('#6e3f00',13)}Trazas</span>`;
  else if(v.k==='no'){let t=v.hit.length===1?AN[v.hit[0]]:AN[v.hit[0]]+' +'+(v.hit.length-1);if(t.length>14)t='No apto';st=`<span class="pill p-no">${I.x('#8a1c12',10)}${t}</span>`}
  else if(v.k==='nd')st=`<span class="pill p-nd">${I.q('#4f4942',12)}Sin ficha</span>`;
  const cls=v.k==='ne'?'':v.k;
  const sr={ne:'',ok:'Apto para ti.',tr:'Puede contener trazas.',no:'No apto para ti.',nd:'Sin ficha de alérgenos.'}[v.k];
  return `<button class="card ${cls}" style="--i:${i}" data-id="${p.id}" aria-label="${esc(p.name)}, ${esc(p.brand)}. ${sr}">
    <span class="ph">${photo(p,72)}</span>
    <span class="cbody"><span class="nm">${esc(p.name)}</span><span class="br">${esc(p.brand)}</span><span class="st">${st}</span></span></button>`;
}

/* Paso 1 (idea B3): ¿Qué evitas? — los 8 más comunes sin desplazarse, el resto bajo "Ver más" */
function avoidStep(fromCat){
  const fresh=S.screen!=='avoid'&&S.screen!=='cat'&&S.screen!=='ficha';
  S.screen='avoid';
  const show=S.moreAl?ALG:ALG.slice(0,TOP);
  const hiddenOn=ALG.slice(TOP).filter(a=>S.F.has(a[0])).length;
  phone.innerHTML=`<div class="view"${fromCat==='keep'?' style="animation:none"':''}>
   <div class="f-top"><button class="back" data-back>${I.back}${WEB?'Carta':'Volver'}</button>${timerTxt()}</div>
   <div class="scroll"><div class="step">
     <div><h1 class="h1">¿Qué evitas?</h1><p class="lead">Toca tus alergias y te mostramos qué puedes comer.</p></div>
     <div class="tiles" role="group" aria-label="Alérgenos">${show.map(([k,n,,x])=>`<button class="tile" data-a="${k}" aria-pressed="${S.F.has(k)}"><span class="ti">${ic(k,20)}</span><span style="min-width:0"><b>${n}</b><small>${x}</small></span><span class="ck">${I.check('#fff',12,2.6)}</span></button>`).join('')}</div>
     <button class="more-al" data-more>${S.moreAl?'Ver menos':`Ver 6 alérgenos más${hiddenOn?` · ${hiddenOn} marcado${hiddenOn>1?'s':''}`:''}`}</button>
   </div></div>
   <div class="f-foot"><button class="btn btn-p" data-go>${I.grid()}${S.F.size?`Ver qué puedo comer`:'Solo quiero mirar la carta'}</button><button class="appqr" data-appqr><span class="ico">${I.phone}</span><span>¿Usas la app AlergiCheck?<small>Carga tus alergias con un código QR</small></span></button></div>
   ${idleBox()}
  </div>`;
  phone.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;S.F.has(a)?S.F.delete(a):S.F.add(a);b.setAttribute('aria-pressed',S.F.has(a));$('[data-go]').innerHTML=`${I.grid()}${S.F.size?'Ver qué puedo comer':'Solo quiero mirar la carta'}`});
  $('[data-more]').onclick=()=>{S.moreAl=!S.moreAl;const sc=$('.scroll').scrollTop;avoidStep('keep');$('.scroll').scrollTop=sc};
  $('[data-go]').onclick=()=>{S.q='';catalog(false,true)};
  if(fromCat===true)S.wasCat=true;else if(fromCat!=='keep')S.wasCat=false;
  $('[data-back]').onclick=()=>(WEB||S.wasCat)?catalog():goRest();
  $('[data-appqr]').onclick=appSheet;
  const st=phone.querySelector('[data-stay]');if(st)st.onclick=resetIdle;
  if(fresh)startIdle();else resetIdle();
}

function headCopy(items){
  if(!S.F.size)return ['¿Qué quieres comer?',`${items.length} ${items.length===1?'producto':'productos'}. Toca uno para ver sus alérgenos.`,false];
  const vs=items.map(p=>verdict(p).k),ok=vs.filter(k=>k==='ok').length,tr=vs.filter(k=>k==='tr').length;
  const sin=S.F.size<=2?'sin '+list([...S.F]):'sin tus '+S.F.size+' alérgenos';
  if(!ok&&!tr)return ['Nada de esto es seguro para ti','Prueba otra categoría o pregunta en caja.',false];
  const h=ok?`${ok} ${ok===1?'opción':'opciones'} ${sin}`:`Solo hay opciones con posibles trazas`;
  return [h,tr?`${tr} ${tr===1?'puede':'pueden'} tener trazas.`:'Lo que no es apto aparece atenuado.',tr>0];
}

function filtered(){
  const qn=norm(S.q.trim());
  const ws=qn.split(/\s+/).filter(w=>w&&!['de','con','la','el','y'].includes(w));
  return P.filter(p=>{if(S.cat!=='all'&&!CATS.find(c=>c[0]===S.cat)[2](p))return false;const t=norm(p.name+' '+p.brand+' '+p.categoria);return ws.every(w=>t.includes(w))});
}

function catalog(keepScroll,fresh0){
  const fresh=fresh0||S.screen!=='cat';S.screen='cat';
  const sc=$('.scroll');const prevScroll=keepScroll&&sc?sc.scrollTop:(fresh0?0:(S.catScroll||0));S.catScroll=0;
  const hadFocus=document.activeElement&&document.activeElement.id==='q';
  const items=filtered();
  const [h,sub,trz]=headCopy(items);
  let g='',i=0;
  if(!items.length)g=`<div class="empty"><b>No encontramos “${esc(S.q)}”</b>Prueba con otra palabra, como “empanada”, “yogurt” o “jugo”.</div>`;
  else if(S.cat==='all'&&!S.q.trim()){
    CATS.forEach(([id,n,fn])=>{const its=items.filter(fn).filter(p=>!CATS.slice(0,CATS.findIndex(c=>c[0]===id)).some(c=>c[2](p)));if(!its.length)return;g+=`<span class="shelf" aria-hidden="true">${n} <small>${its.length}</small></span>`;its.forEach(p=>g+=cardHTML(p,Math.min(i++,24)))});
  }else items.forEach(p=>g+=cardHTML(p,Math.min(i++,24)));
  const avoidTxt=S.F.size?`<span class="lbl">Evitas${S.fromApp?' · desde tu app':''}<b>${[...S.F].map(a=>AN[a]).join(', ')}</b></span><button class="chg" data-chg>Cambiar</button>`:`<span class="lbl">Sin filtros<b>Marca lo que evitas</b></span><button class="chg" data-chg>Marcar</button>`;
  phone.innerHTML=`<div class="view"${fresh?'':' style="animation:none"'}>
   ${topBar()}
   <div class="scroll">
     <div class="cat-head"><h1 class="cat-h">${h}</h1><p class="cat-p">${sub}${trz?` <button class="lnk" data-trazas>¿Qué son las trazas?</button>`:''}</p></div>
     <div class="tools">
       <label class="search">${I.search}<input id="q" type="text" inputmode="search" placeholder="Buscar un producto" value="${esc(S.q)}" autocomplete="off" enterkeyhint="search">${S.q?`<button class="x" data-clearq aria-label="Borrar búsqueda">${I.x('#1b1916',10)}</button>`:''}</label>
       <div class="cats" role="group" aria-label="Categorías">${[['all','Todo'],...CATS.map(c=>[c[0],c[1]])].map(([k,n])=>`<button class="cb" data-cat="${k}" aria-pressed="${S.cat===k}">${n}</button>`).join('')}</div>
     </div>
     <div class="grid">${g}</div>
   </div>
   <div class="avoid">${avoidTxt}</div>
   ${idleBox()}
  </div>`;
  $('.scroll').scrollTop=prevScroll;
  const q=$('#q');q.oninput=()=>{S.q=q.value;catalog(true);const n=$('#q');n.focus();n.setSelectionRange(n.value.length,n.value.length)};
  if(hadFocus){q.focus();q.setSelectionRange(q.value.length,q.value.length)}
  const cq=$('[data-clearq]');if(cq)cq.onclick=e=>{e.preventDefault();S.q='';catalog(true)};
  phone.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;catalog(false,false);$('.scroll').scrollTop=0;phone.querySelector(`[data-cat="${S.cat}"]`).scrollIntoView({inline:'center',block:'nearest'})});
  $('[data-chg]').onclick=()=>avoidStep(true);
  const tz=$('[data-trazas]');if(tz)tz.onclick=trazasSheet;
  const st=phone.querySelector('[data-stay]');if(st)st.onclick=resetIdle;
  phone.querySelectorAll('.card').forEach(b=>b.onclick=()=>ficha(b.dataset.id));
  if(fresh&&fresh0){phone.querySelectorAll('.card.ok').forEach(el=>el.classList.add('lit'))}
  if(fresh)startIdle();else paintIdle();
}

function ficha(id){
  if(S.screen==='cat')S.catScroll=$('.scroll')?.scrollTop||0;
  const p=byId[id];S.screen='ficha';S.prod=id;
  const v=verdict(p);
  const F=[...S.F];
  let vb,rows='',extra='',foot;
  const icn={ok:I.check('#fff',20,2.6),tr:I.warn('#fff',20),no:I.x('#fff',16,2.6),ne:I.q('#7a4a35',22),nd:I.warn('#fff',20)};
  const row=(a,res)=>`<div class="ar ${S.F.has(a)?'mine':''}"><span class="ai">${ic(a,19)}</span><span class="nmx"><b>${AN[a]}${S.F.has(a)?'<span class="evit">evitas</span>':''}</b><small>Ej.: ${AX[a]}</small></span>${res}</div>`;
  if(p.pending){
    vb=['tr','Aún no tenemos su ficha','Es un producto nuevo y el personal todavía no registra sus alérgenos.'];
    const show=F.length?F:ALG.slice(0,5).map(a=>a[0]);
    rows=show.map(a=>row(a,`<span class="res r-nd">Sin datos</span>`)).join('');
    extra=`<div class="ing"><h4>Mientras tanto</h4><p>Revisa la etiqueta del empaque o pregunta en caja antes de comerlo.</p></div>`;
    foot=`<button class="btn btn-p" data-opts>${I.grid()}${F.length?'Ver opciones aptas para ti':'Ver otros productos'}</button>${S.asked.has(p.id)?`<button class="btn btn-s" disabled>${I.check('#1b1916',14)}Ya avisamos a la cafetería</button>`:`<button class="btn btn-s" data-ask>${I.flag}Pedir que registren esta ficha</button>`}`;
  }else{
    if(v.k==='ok'){const p2=p.m.length?` Puede tener trazas de ${listY(p.m)}, que no marcaste.`:'';vb=['ok','Apto para ti',`No contiene ${list(F)}.${p2}`]}
    else if(v.k==='tr')vb=['tr','Consúmelo con precaución',`No lleva ${listY(v.tr)} como ingrediente, pero puede tener restos (trazas). Si tu alergia es severa, mejor elige otro.`];
    else if(v.k==='no')vb=['no','No es apto para ti',`Contiene ${listY(v.hit)}.`];
    else vb=['ne','¿Es apto para ti?','Marca los alérgenos que evitas y te lo decimos al instante.'];
    const st=a=>p.c.includes(a)?`<span class="res r-no">${I.x('#8a1c12',11)}Contiene</span>`:p.m.includes(a)?`<span class="res r-tr">${I.warn('#6e3f00',14)}Puede<br>contener</span>`:`<span class="res r-ok">${I.check('#135532',14)}No contiene</span>`;
    const order=[...F,...p.c.filter(a=>!S.F.has(a)),...p.m.filter(a=>!S.F.has(a)&&!p.c.includes(a))];
    rows=order.map(a=>row(a,st(a))).join('');
    const restN=ALG.length-order.length;
    rows+=`<div class="rest-note">${order.length?`No contiene ninguno de los otros ${restN} alérgenos.`:'No contiene ninguno de los 14 alérgenos principales.'}</div>`;
    const n=nutri(p);
    extra=(p.m.length?`<div class="explain"><span class="ei">${I.warn('#a15c00',16)}</span><div><b>¿Qué significa “puede contener”?</b><p>Que no es un ingrediente, pero pueden quedar restos porque se prepara junto a otros alimentos. Si tu alergia es severa, evítalo.</p></div></div>`:'')
      +`<div class="ing"><h4>Ingredientes</h4><p>${esc(p.ing)}</p>
        <div class="src">${I.shield('#1c7a47',15)}<span><b>Fuente:</b> ficha de ${esc(META.cafeteria||'la cafetería')} armada con la etiqueta y la carta. Fichas de prueba: confirma en caja si tu alergia es severa.</span></div></div>`
      +(n?`<details class="nut"><summary><span>Información nutricional <small>· por 100 g</small></span>${I.chev}</summary><div class="ntab">
        ${[['Energía',n[0]+' kcal'],['Grasas totales',n[1]+' g'],['Grasas saturadas',n[2]+' g'],['Azúcares',n[3]+' g'],['Sodio',n[4]+' mg']].map(([k,x])=>`<div class="nrow"><span>${k}</span><b>${x}</b></div>`).join('')}
        ${octs(n)}
        <p class="nnote">Valores de ejemplo por 100 g para el prototipo; la cafetería aún no publica su tabla nutricional.</p></div></details>`:'');
    foot=v.k==='ne'?`<button class="btn btn-p" data-mark>${I.grid()}Marcar lo que evito</button>`:`<button class="btn btn-p" data-opts>${I.grid()}${v.k==='no'?'Ver opciones aptas para ti':'Ver otros productos'}</button>`;
  }
  phone.innerHTML=`<div class="view">
   <div class="f-top"><button class="back" data-back>${I.back}Volver</button>${timerTxt()}</div>
   <div class="scroll"><div class="ficha">
     <div class="hero"><span class="ph">${photo(p,140)}</span><div class="hi"><h2>${esc(p.name)}</h2><div class="meta">${esc(p.brand)} · ${esc(p.categoria)}${p.price!=null?` · <span class="num">S/ ${p.price.toFixed(2)}</span>`:''}</div></div></div>
     <div class="verdict v-${vb[0]}" role="status"><span class="vi">${icn[p.pending?'nd':vb[0]]}</span><div><h3>${vb[1]}</h3><p>${vb[2]}</p></div></div>
     <h3 class="sec-h">Sus alérgenos, uno por uno</h3>
     <div class="table">${rows}</div>
     ${extra}
   </div></div>
   <div class="f-foot">${foot}</div>
   ${idleBox()}
  </div>`;
  $('[data-back]').onclick=()=>catalog();
  const st=phone.querySelector('[data-stay]');if(st)st.onclick=resetIdle;
  const o=$('[data-opts]');if(o)o.onclick=()=>catalog();
  const m=$('[data-mark]');if(m)m.onclick=()=>avoidStep(true);
  const a=$('[data-ask]');if(a)a.onclick=()=>sent(p);
  resetIdle();
}
/* octógonos de advertencia (Ley 30021), con los límites para sólidos */
function octs(n){const o=[];if(n[3]>=10)o.push('ALTO EN<br>AZÚCAR');if(n[4]>=400)o.push('ALTO EN<br>SODIO');if(n[2]>=4)o.push('ALTO EN<br>GRASAS<br>SATURADAS');return o.length?`<div class="oct" aria-label="Advertencias: ${o.join(', ').replace(/<br>/g,' ')}">${o.map(t=>`<span>${t}<br>EVITAR SU<br>CONSUMO<br>EXCESIVO</span>`).join('')}</div>`:''}

/* ---------------- Hojas ---------------- */
function sheet(html){
  const bd=document.createElement('div');bd.className='bd';
  const sh=document.createElement('div');sh.className='sheet';sh.setAttribute('role','dialog');sh.innerHTML='<span class="grab"></span>'+html;
  phone.append(bd,sh);requestAnimationFrame(()=>{bd.classList.add('show');sh.classList.add('show')});
  const close=()=>{bd.classList.remove('show');sh.classList.remove('show');setTimeout(()=>{bd.remove();sh.remove()},400)};
  bd.onclick=close;sh.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  return {sh,close};
}

function trazasSheet(){
